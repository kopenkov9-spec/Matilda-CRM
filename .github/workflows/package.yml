name: Изграждане на инсталационния пакет на Матилда
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Matilda-CRM-Setup
          path: dist/Matilda-CRM-Setup.*
